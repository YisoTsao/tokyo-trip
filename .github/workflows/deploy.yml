name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pick up edits made in the Notion 旅費 / 交通與住宿預訂 tables.
  schedule:
    - cron: "*/30 * * * *"
  # While Settings → Pages → Source is still "Deploy from a branch", GitHub's own
  # Jekyll deploy publishes the raw source index.html (a blank page). Redeploy the
  # Vite build after it so the real site always wins.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync Notion tables
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EXPENSES_DB: a5519c6c8ce64876bb0ddf787af29c7a
          NOTION_BOOKINGS_DB: 4941eadff10b4cecb15563aebcd69d02
      - name: Check the live Notion API on Vercel
        # Informational only: the page falls back to the snapshot if this is down.
        run: |
          curl -sS -m 20 "$VITE_TRIP_API" -o live.json -w "HTTP %{http_code}\n" || true
          node -e 'try { const d = require("./live.json"); console.log(d.error ?? `live API: ${d.expenses.length} expense rows, ${d.bookings.length} bookings`); } catch (e) { console.log("live API: no JSON", e.message); }'
          rm -f live.json
        env:
          VITE_TRIP_API: https://tokyo-trip-eosin.vercel.app/api/trip
      - run: npm run build
        env:
          VITE_TRIP_API: https://tokyo-trip-eosin.vercel.app/api/trip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
